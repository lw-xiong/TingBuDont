[package]
name = "tingbudont"
version = "0.1.0"
edition = "2024"
description = "Chinese university PDFs to Markdown for LLM input."
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
# Font-encoding diagnostics; pdfsink-rs already pulls this version in.
lopdf = "0.42"
pdfsink-rs = "0.2"
# Scanned pages. Pure Rust (PP-OCRv6 on rten). Costs ~105 MB + ~100 MB/Mpx, so
# it is loaded only under `--ocr`; models come from scripts/fetch-models.sh.
rusto-rs = { git = "https://github.com/byrizki/rusto-rs", tag = "v0.3.1" }
# JPEG header read only, for page image dimensions.
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
